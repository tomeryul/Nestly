<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f5f1e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // An iPhone home-screen app takes its status bar colour from these tags once,
      // at launch, so they have to match the saved theme before anything else runs
      // (src/lib/theme.ts reloads on a switch for the same reason).
      (function () {
        var t = null;
        try { t = localStorage.getItem("nestly.theme"); } catch (e) {}
        if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "garden-night" : "garden";
        var bg = { garden: "#f5f1e6", "garden-night": "#161412", "warm-dark": "#f7f4f5", "warm-light": "#f2f5f7", "cool-dark": "#f3f6f2", midnight: "#f5f4f8" }[t] || "#f5f1e6";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", t === "garden-night" ? "black" : "default");
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>Nestly · ניהול הבית</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
